name: Build msa-ui APK

# Manual trigger only. Two use cases:
#
# 1. QA verification of an unreleased RC published by the SDK repo's
#    "MineSec Headless SDK RC release (internal)" workflow (artifactId
#    headless-stage-rc, version like 1.3.24-rc.2, lives on ms-registry-internal):
#      channel = rc, sdk_version = 1.3.24-rc.2
#
# 2. After QA approves and someone runs the SDK repo's "Promote RC to release"
#    workflow (same bytes republished as headless-stage on ms-registry-client,
#    version with the -rc.N suffix stripped), build the same app against the
#    now-formal SDK version:
#      channel = release, sdk_version = 1.3.24
#
# Leaving sdk_version empty on the release channel falls back to whatever
# `versionHeadless` is pinned to in gradle.properties.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'SDK channel to build against'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - rc
      sdk_version:
        description: 'SDK version, e.g. 1.3.24 (release) or 1.3.24-rc.2 (rc). Empty = gradle.properties versionHeadless (release channel only).'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [[ "${{ inputs.channel }}" == "rc" && -z "${{ inputs.sdk_version }}" ]]; then
            echo "::error::sdk_version is required when channel=rc"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Configure MineSec registry credentials
        run: |
          {
            echo "MINESEC_REGISTRY_LOGIN=${{ secrets.MINESEC_REGISTRY_LOGIN }}"
            echo "MINESEC_REGISTRY_TOKEN=${{ secrets.MINESEC_REGISTRY_TOKEN }}"
          } >> gradle.properties
          if [[ "${{ inputs.channel }}" == "rc" ]]; then
            {
              echo "MS_INTERNAL_REGISTRY_USER=${{ secrets.MS_INTERNAL_REGISTRY_USER }}"
              echo "MS_INTERNAL_REGISTRY_TOKEN=${{ secrets.MS_INTERNAL_REGISTRY_TOKEN }}"
            } >> gradle.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build msa-ui APK
        run: |
          ARGS=(":msa-ui:assembleDebug" "-PsdkChannel=${{ inputs.channel }}")
          if [[ -n "${{ inputs.sdk_version }}" ]]; then
            ARGS+=("-PsdkVersion=${{ inputs.sdk_version }}")
          fi
          ./gradlew "${ARGS[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: msa-ui-${{ inputs.channel }}-${{ inputs.sdk_version || 'default' }}
          path: msa-ui/build/outputs/apk/**/*.apk
          if-no-files-found: error
